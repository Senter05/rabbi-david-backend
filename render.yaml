services:
  - type: web
    name: rabbi-david-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --enable-voice
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: RENDER
        value: "true"
      - key: FREE_TESTING
        value: "true"
