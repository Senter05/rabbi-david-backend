services:
  - type: web
    name: rabbi-david-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --host 0.0.0.0
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PRODUCTION
        value: "1"
      - key: PUBLIC_ORIGIN
        value: https://rabbidavid.org
      - key: DATA_DIR
        sync: false
      - key: ENABLE_VOICE
        value: "0"
      - key: FREE_TESTING
        value: "false"
      - key: SMTP_HOST
        # Existing Resend SMTP credentials are automatically used over HTTPS.
        # RESEND_API_KEY, when set in Render, takes precedence over SMTP_PASSWORD.
        value: "smtp.resend.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: "resend"
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        value: "Rabbi David <delivery@rabbidavid.org>"
      - key: SUPPORT_EMAIL
        value: "soporte@rabbidavid.org"
