services:
  - type: web
    name: rabbi-david-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --host 0.0.0.0
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PRODUCTION
        value: "1"
      - key: PUBLIC_ORIGIN
        value: https://rabbidavid.org
      - key: DATA_DIR
        sync: false
      - key: ENABLE_VOICE
        value: "1"
      - key: FREE_TESTING
        value: "true"
      - key: SMTP_HOST
        # Existing Resend SMTP credentials are automatically used over HTTPS.
        # RESEND_API_KEY, when set in Render, takes precedence over SMTP_PASSWORD.
        value: "smtp.resend.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: "resend"
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        value: "Rabbi David <delivery@rabbidavid.org>"
      - key: SUPPORT_EMAIL
        value: "soporte@rabbidavid.org"
      - key: SUPABASE_URL
        value: "https://gkihlvkdkciqpkrhbunv.supabase.co"
      - key: SUPABASE_KEY
        value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdraWhsdmtka2NpcXBrcmhidW52Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4OTU1NDgxOCwiZXhwIjoyMTA1MTMwODE4fQ.XlGVP58ldWp7_6Yn9lE_nkNJFWo6N_RswQ6Uy7pVMc8"
      - key: SUPABASE_SERVICE_ROLE_KEY
