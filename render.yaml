services:
  - type: web
    name: rabbi-david-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --host 0.0.0.0
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PRODUCTION
        value: "1"
      - key: PUBLIC_ORIGIN
        value: https://rabbidavid.org
      - key: DATA_DIR
        sync: false
      - key: ENABLE_VOICE
        value: "0"
      - key: FREE_TESTING
        value: "false"
